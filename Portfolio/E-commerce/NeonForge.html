<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON FORGE · PC Shop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="NF.css?v=3">
</head>
<body>
    <div class="cyber-card">
        <div class="static-header">
            <div class="brand">
                <i class="fas fa-microchip"></i>
                <h1><span class="neon">NEON</span><span class="forge">FORGE</span></h1>
            </div>
            <div class="header-actions">
                <div class="user-info">
                    <i class="fas fa-user-circle"></i>
                    <span id="user-name">Guest</span>
                </div>
                <button id="cart-toggle" class="cart-icon-btn">
                    <i class="fas fa-shopping-cart"></i>
                    <span id="cart-count">0</span>
                </button>
                <button id="logout-btn" class="logout-btn-header"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </div>

        <div class="dashboard-nav">
            <button class="dash-btn active" data-section="all"><i class="fas fa-th-large"></i> <span>All</span></button>
            <button class="dash-btn" data-section="Monitors"><i class="fas fa-desktop"></i> <span>Monitors</span></button>
            <button class="dash-btn" data-section="System Units"><i class="fas fa-server"></i> <span>System Units</span></button>
            <button class="dash-btn" data-section="Mice"><i class="fas fa-mouse"></i> <span>Mice</span></button>
            <button class="dash-btn" data-section="Headphones"><i class="fas fa-headphones"></i> <span>Headphones</span></button>
            <button class="dash-btn" data-section="Keyboards"><i class="fas fa-keyboard"></i> <span>Keyboards</span></button>
        </div>

        <div class="dash-content">
            <div id="loading" class="loading">⚡ LOADING INVENTORY...</div>
            <div id="error-message" class="error-message" style="display:none;"></div>
            <div id="product-container" class="product-grid"></div>
        </div>

        <div class="footer-note">
            <i class="fas fa-shield-halved"></i> NEON FORGE · PC SHOP <i class="fas fa-bolt"></i>
        </div>
    </div>

    <div id="product-modal" class="modal-overlay">
        <div class="modal-box">
            <button class="modal-close" onclick="closeProductModal()"><i class="fas fa-times"></i></button>
            <div id="modal-content" class="modal-content"></div>
        </div>
    </div>

    <div id="cart-overlay" class="cart-overlay"></div>
    <aside id="cart-sidebar" class="cart-sidebar">
        <div class="cart-header">
            <h2><i class="fas fa-shopping-cart"></i> Your Cart</h2>
            <button id="cart-close" class="cart-close-btn"><i class="fas fa-times"></i></button>
        </div>
        <div id="cart-items" class="cart-items"></div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Total:</span>
                <span id="cart-total">₱0</span>
            </div>
            <button id="checkout-btn" class="checkout-btn"><i class="fas fa-bolt"></i> CHECKOUT</button>
        </div>
    </aside>

    <div id="payment-modal" class="modal-overlay">
        <div class="modal-box payment-box">
            <button class="modal-close" onclick="closePaymentModal()"><i class="fas fa-times"></i></button>
            <div class="payment-header">
                <h2><i class="fas fa-credit-card"></i> PAYMENT</h2>
                <div class="payment-total">Amount Due: <span id="payment-amount">₱0</span></div>
            </div>

            <form id="payment-form" class="payment-form">
                <div class="form-section">
                    <h3><i class="fas fa-user"></i> Deliver To</h3>
                    <div class="user-info-display">
                        <p><strong id="checkout-name">—</strong></p>
                        <p id="checkout-email">—</p>
                        <p id="checkout-phone">—</p>
                    </div>
                    <div class="location-input-row">
                        <input type="text" id="deliver-location" placeholder="Delivery location (address or GPS pin)">
                        <button type="button" class="use-location-btn" id="use-location-btn" title="Use my location" aria-label="Use my location">
                            <i class="fas fa-location-crosshairs"></i>
                        </button>
                    </div>
                    <span class="location-status" id="location-status"></span>
                </div>

                <div class="form-section">
                    <h3><i class="fas fa-wallet"></i> Payment Method</h3>
                    <div class="payment-methods">
                        <label class="payment-option active">
                            <input type="radio" name="payment" value="GCash" checked>
                            <i class="fas fa-mobile-alt"></i>
                            <span>GCash</span>
                        </label>
                        <label class="payment-option">
                            <input type="radio" name="payment" value="Maya">
                            <i class="fas fa-bolt"></i>
                            <span>Maya</span>
                        </label>
                        <label class="payment-option">
                            <input type="radio" name="payment" value="Credit Card">
                            <i class="fas fa-credit-card"></i>
                            <span>Credit Card</span>
                        </label>
                        <label class="payment-option">
                            <input type="radio" name="payment" value="Cash on Delivery">
                            <i class="fas fa-truck"></i>
                            <span>COD</span>
                        </label>
                    </div>
                </div>

                <div class="form-section" id="card-details" style="display:none;">
                    <h3><i class="fas fa-lock"></i> Card Details</h3>
                    <input type="text" id="card-number" placeholder="Card Number (0000 0000 0000 0000)" maxlength="19">
                    <div class="card-row">
                        <input type="text" id="card-expiry" placeholder="MM/YY" maxlength="5">
                        <input type="text" id="card-cvv" placeholder="CVV" maxlength="4">
                    </div>
                </div>

                <div class="form-section" id="cod-address" style="display:none;">
                    <h3><i class="fas fa-map-marker-alt"></i> Delivery Address (COD)</h3>
                    <input type="text" id="addr-street" placeholder="House No. / Street / Barangay">
                    <input type="text" id="addr-city" placeholder="City / Municipality">
                    <input type="text" id="addr-province" placeholder="Province">
                    <div class="card-row">
                        <input type="text" id="addr-zip" placeholder="ZIP Code" maxlength="4">
                        <input type="text" id="addr-landmark" placeholder="Landmark (optional)">
                    </div>
                    <textarea id="addr-notes" placeholder="Delivery Notes (optional)" rows="2"></textarea>
                </div>

                <button type="submit" class="pay-now-btn"><i class="fas fa-lock"></i> PAY NOW</button>
            </form>
        </div>
    </div>

    <div id="receipt-modal" class="modal-overlay">
        <div class="modal-box receipt-box">
            <div id="receipt-content" class="receipt-content"></div>
            <div class="receipt-actions">
                <button onclick="printReceipt()" class="receipt-btn"><i class="fas fa-print"></i> PRINT</button>
                <button onclick="closeReceiptModal()" class="receipt-btn secondary"><i class="fas fa-check"></i> DONE</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="NF.js?v=3"></script>
</body>
</html>
