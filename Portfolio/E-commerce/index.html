<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON FORGE · Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Admin.css">
</head>
<body>
    <div class="login-screen">
        <div class="login-box">
            <div class="login-brand">
                <i class="fas fa-microchip"></i>
                <h1><span class="neon">NEON</span><span class="forge">FORGE</span></h1>
                <p>SECURE ACCESS PORTAL</p>
            </div>

            <div class="login-tabs">
                <button id="tab-login" class="login-tab active">LOGIN</button>
                <button id="tab-register" class="login-tab">REGISTER</button>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Email</label>
                    <input type="email" id="login-email" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Password</label>
                    <input type="password" id="login-password" placeholder="Enter password" required>
                </div>
                <div id="login-error" class="login-error"></div>
                <button type="submit" class="login-btn"><i class="fas fa-bolt"></i> LOGIN</button>
            </form>

            <form id="register-form" style="display:none;">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Full Name</label>
                    <input type="text" id="reg-name" placeholder="Juan Dela Cruz" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Email</label>
                    <input type="email" id="reg-email" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-phone"></i> Phone Number</label>
                    <input type="tel" id="reg-phone" placeholder="09123456789" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Password</label>
                    <input type="password" id="reg-password" placeholder="Minimum 6 characters" required minlength="6">
                </div>
                <div id="register-error" class="login-error"></div>
                <button type="submit" class="login-btn"><i class="fas fa-user-plus"></i> CREATE ACCOUNT</button>
            </form>

            <div class="login-footer">
                <i class="fas fa-shield-halved"></i> CYBERPUNK · SECURE · 2087
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="index.js"></script>
</body>
</html>
